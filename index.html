<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Image Processor - Pro Studio</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="model/ScriptModel.js"></script>
    <script src="view/ScriptView.js"></script>
    <script src="service/VideoService.js"></script>
    <script src="controller/ScriptController.js"></script>
    <style>
        /* Otimização da experiência do usuário (UX) */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a202c;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }

        /* Ocultação do canvas de processamento (Buffer interno para extração de Raw Data) */
        #canvas-proc {
            display: none;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">

        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
            <div>
                <h1
                    class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                    JS Image Studio</h1>
                <p class="text-gray-400 text-sm italic">Robotic Vision Engine & Video Recorder</p>
            </div>
            <div class="flex gap-2">
                <button id="reset"
                    class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-medium transition">Resetar</button>
                <a id="download-btn"
                    class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-medium transition text-center flex items-center cursor-pointer">
                    Salvar Foto
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-2 space-y-6">

                <div id="drop-zone"
                    class="relative bg-black rounded-xl overflow-hidden shadow-2xl border-2 border-dashed border-gray-700 min-h-[450px] flex items-center justify-center transition-all duration-300">

                    <img id="preview" src="" class="max-w-full max-h-[600px] object-contain" style="display: none;">

                    <video id="webcam" autoplay playsinline class="max-w-full h-auto scale-x-[-1]"
                        style="display: none;"></video>

                    <div id="recording-timer"
                        class="absolute top-4 right-4 bg-red-600/90 text-white px-4 py-2 rounded-full text-sm font-mono hidden items-center gap-2 z-10 shadow-lg">
                        <span class="w-3 h-3 bg-white rounded-full animate-ping"></span>
                        <span id="timer-display">00:00</span>
                    </div>

                    <div id="placeholder-text" class="text-gray-600 flex flex-col items-center pointer-events-none">
                        <span class="text-5xl mb-4">📥</span>
                        <p class="font-medium text-lg">Arraste uma imagem aqui</p>
                        <p class="text-sm mt-2">ou use os sensores ao lado</p>
                    </div>
                </div>

                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-semibold uppercase tracking-widest text-gray-500">Histograma Dinâmico de
                            Intensidade Luminosa</h3>
                    </div>
                    <canvas id="histogram-canvas" class="w-full h-32 rounded bg-black"></canvas>
                </div>
            </div>

            <div
                class="space-y-6 bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-xl overflow-y-auto max-h-[85vh]">

                <div>
                    <h3 class="text-sm font-bold mb-4 flex items-center gap-2"><span>📥</span> Entrada de Mídia</h3>
                    <input type="file" id="upload" accept="image/*"
                        class="text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:bg-blue-600 file:text-white border-0 cursor-pointer w-full">
                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <button id="btn-webcam"
                            class="bg-gray-700 hover:bg-gray-600 py-2 rounded-lg text-sm font-medium transition">Ativar
                            Webcam</button>
                        <button id="record-btn"
                            class="bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-sm font-medium transition">📹
                            Gravar </button>
                    </div>
                </div>

                <hr class="border-gray-700">

                <div class="space-y-4">
                    <h3 class="text-sm font-bold mb-2 flex items-center gap-2"><span>🎛️</span> Ajustes de Visão</h3>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase text-gray-500">Brilho (Exposição)</label>
                            <input type="range" id="brightness" min="0" max="200" value="100"
                                class="w-full h-1.5 bg-gray-900 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase text-gray-500">Contraste (Dinâmica)</label>
                            <input type="range" id="contrast" min="0" max="200" value="100"
                                class="w-full h-1.5 bg-gray-900 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase text-gray-500">Saturação (Ganhos Cromáticos)</label>
                            <input type="range" id="saturate" min="0" max="300" value="100"
                                class="w-full h-1.5 bg-gray-900 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase text-gray-500">Grayscale (Segmentação de Tons)</label>
                            <input type="range" id="gray" min="0" max="100" value="0"
                                class="w-full h-1.5 bg-gray-900 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase text-gray-500">Opacidade (Camadas)</label>
                            <input type="range" id="opacity" min="0" max="100" value="100"
                                class="w-full h-1.5 bg-gray-900 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase text-gray-500">Desfoque (Redução de Ruído)</label>
                            <input type="range" id="blur" min="0" max="10" value="0"
                                class="w-full h-1.5 bg-gray-900 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                    </div>
                </div>

                <div class="space-y-3">
                    <h3 class="text-sm font-bold flex items-center gap-2"><span>🎨</span> Presets de Filtros</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="aplicarPreset('sepia')"
                            class="bg-amber-700/80 hover:bg-amber-600 py-2 rounded-lg text-[10px] font-medium transition">Sépia</button>
                        <button onclick="aplicarPreset('noir')"
                            class="bg-gray-600 hover:bg-gray-500 py-2 rounded-lg text-[10px] font-medium transition">Noir</button>
                        <button onclick="aplicarPreset('vibrant')"
                            class="bg-pink-600/80 hover:bg-pink-500 py-2 rounded-lg text-[10px] font-medium transition">Vibrant</button>
                    </div>
                    <button id="edge-btn"
                        class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded-lg text-xs font-bold transition">🔍
                        Algoritmo de Bordas (Edge Detection)</button>
                </div>

                <hr class="border-gray-700">

                <div class="space-y-3">
                    <h3 class="text-sm font-bold flex items-center gap-2"><span>📊</span> Extração de Canais Cromáticos
                    </h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="separarCanal('r')"
                            class="bg-red-700 hover:bg-red-600 py-2 rounded-lg text-[10px] font-bold transition">Canal
                            Red</button>
                        <button onclick="separarCanal('g')"
                            class="bg-green-700 hover:bg-green-600 py-2 rounded-lg text-[10px] font-bold transition">Canal
                            Green</button>
                        <button onclick="separarCanal('b')"
                            class="bg-blue-700 hover:bg-blue-600 py-2 rounded-lg text-[10px] font-bold transition">Canal
                            Blue</button>
                    </div>
                    <button onclick="inverterCores()"
                        class="w-full bg-indigo-100 hover:bg-white text-indigo-900 py-2 rounded-lg text-xs font-black transition flex items-center justify-center gap-2 uppercase tracking-tighter">
                        <span>🌓</span> Inverter Polaridade (Negativo)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas-proc" class="hidden"></canvas>

</body>

</html>
